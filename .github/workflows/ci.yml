name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  srs-present:
    name: SRS freeze present (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail closed if docs/srs.md is missing
        run: |
          set -euo pipefail
          if [ ! -f docs/srs.md ]; then
            echo "docs/srs.md is missing. Fail closed: no invented FR/NFR IDs, no silent skip."
            exit 1
          fi
          grep -q 'FR-1' docs/srs.md
          grep -q 'FR-18' docs/srs.md
          grep -q 'NFR-1' docs/srs.md
          grep -q 'NFR-9' docs/srs.md
          echo "docs/srs.md present with FR-1..FR-18 and NFR-1..NFR-9 citations."
      - name: Fail closed if official SRS PDF is missing
        run: |
          set -euo pipefail
          PDF="docs/official/MSEE_Web_Application_and_Interface_Design_Cafe_Fausse_SRS.pdf"
          if [ ! -f "$PDF" ]; then
            echo "Official SRS PDF missing. Fail closed: PDF is SoT; do not skip."
            exit 1
          fi
          # PDF header probe (this-session-style file check)
          python3 -c "import pathlib,sys; p=pathlib.Path('$PDF'); b=p.read_bytes()[:8]; sys.exit(0 if b.startswith(b'%PDF') else 1)"
          echo "$PDF  SHA256 expected"
          echo "6075e5964601aa3e3c7a3085c626eab820e3d733a396b00e20339cfdc77a9d82  $PDF" | sha256sum -c
          ZIP="docs/official/MSEE_Web_Application_and_Interface_Design_Cafe_Fausse_Images.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Official images.zip missing. Fail closed."
            exit 1
          fi
          echo "59730ee04e5d74fa524122f220122a7db1964cf9163cd4e7daa704d440db2437  $ZIP" | sha256sum -c
          echo "Official SRS PDF and images.zip present with freeze SHA256."
