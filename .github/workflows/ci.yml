name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  srs-present:
    name: SRS freeze present (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail closed if docs/srs.md is missing
        run: |
          set -euo pipefail
          if [ ! -f docs/srs.md ]; then
            echo "docs/srs.md is missing. Fail closed: no invented FR/NFR IDs, no silent skip."
            exit 1
          fi
          # Require actual freeze entries (**FR-n:** / **NFR-n:**).
          # Substring grep -q 'FR-1' matches the provenance range FR-1..FR-18
          # and also FR-10..FR-18, so deleting real entries can still leave CI green.
          missing=0
          for n in $(seq 1 18); do
            if ! grep -qF -- "**FR-${n}:**" docs/srs.md; then
              echo "Missing freeze entry **FR-${n}:**"
              missing=1
            fi
          done
          for n in $(seq 1 9); do
            if ! grep -qF -- "**NFR-${n}:**" docs/srs.md; then
              echo "Missing freeze entry **NFR-${n}:**"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "docs/srs.md is missing required FR-1..FR-18 / NFR-1..NFR-9 freeze entries. Fail closed."
            exit 1
          fi
          echo "docs/srs.md present with **FR-1:**..**FR-18:** and **NFR-1:**..**NFR-9:** freeze entries."
      - name: Fail closed if official SRS PDF is missing
        run: |
          set -euo pipefail
          PDF="docs/official/MSEE_Web_Application_and_Interface_Design_Cafe_Fausse_SRS.pdf"
          if [ ! -f "$PDF" ]; then
            echo "Official SRS PDF missing. Fail closed: PDF is SoT; do not skip."
            exit 1
          fi
          # PDF header probe (this-session-style file check)
          python3 -c "import pathlib,sys; p=pathlib.Path('$PDF'); b=p.read_bytes()[:8]; sys.exit(0 if b.startswith(b'%PDF') else 1)"
          echo "$PDF  SHA256 expected"
          echo "6075e5964601aa3e3c7a3085c626eab820e3d733a396b00e20339cfdc77a9d82  $PDF" | sha256sum -c
          ZIP="docs/official/MSEE_Web_Application_and_Interface_Design_Cafe_Fausse_Images.zip"
          if [ ! -f "$ZIP" ]; then
            echo "Official images.zip missing. Fail closed."
            exit 1
          fi
          echo "59730ee04e5d74fa524122f220122a7db1964cf9163cd4e7daa704d440db2437  $ZIP" | sha256sum -c
          echo "Official SRS PDF and images.zip present with freeze SHA256."

  github-only:
    name: GitHub only (no GitLab CI files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail if GitLab CI files are present
        run: |
          set -euo pipefail
          if [ -f .gitlab-ci.yml ] || [ -d .gitlab ]; then
            echo "GitLab CI files are not allowed. Tracker and CI are GitHub Actions only."
            exit 1
          fi
          echo "No GitLab CI files."

  one-issue-closer:
    name: One issue per PR (fail-closed)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fail if PR body closes more than one issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_one_issue_closer.py --self-test
          python3 scripts/ci/check_one_issue_closer.py

  restaurant-api:
    name: Restaurant API tests (FR-6..FR-9, FR-15..FR-18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe_fausse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe_fausse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cafe:cafe@127.0.0.1:5432/cafe_fausse_test
      DB_CONNECT_TIMEOUT: "2"
      DB_STATEMENT_TIMEOUT_MS: "2000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r backend/requirements.txt
      - name: Run pytest
        run: pytest

  restaurant-frontend:
    name: Restaurant frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
