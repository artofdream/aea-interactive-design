name: App

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Flask API + PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cafe
          POSTGRES_PASSWORD: cafe
          POSTGRES_DB: cafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cafe -d cafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cafe:cafe@127.0.0.1:5432/cafe_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Apply schema
        run: python -m cafe_fausse init-db
        working-directory: backend
      - name: Pytest
        run: pytest
        working-directory: backend

  frontend:
    name: React build + freeze facts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze facts (menu prices, address, no invented IDs)
        run: python3 scripts/check_srs_facts.py
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
