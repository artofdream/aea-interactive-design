# Local PostgreSQL only. Not AWS. cafe.artof.link hosting is future.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe
      POSTGRES_DB: cafe_fausse
    ports:
      - "5432:5432"
    volumes:
      - cafe_pg:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  cafe_pg:
