  <title id="t2">MSAIE staging — HLD (cafe.artof.link)</title>
  <desc id="d2">MSAIE staging at cafe.artof.link. DNS to TLS to Flask plus built SPA to on-box Postgres. Key Flask routes labeled. Knowledge Pages separate. Out of cut: AEA RDS, ELB wildcard, permanent hosting. Newsletter store-only. Tip 73d202d.</desc>
