<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" role="img" aria-labelledby="t1 d1">
  <title id="t1">Local (dev) — HLD</title>
  <desc id="d1">Local (dev): Vite React frontend, Flask API with key routes, local PostgreSQL, freeze file shared by FE and API. Fail-closed without DB. For coding and iteration — not the shared demo URL.</desc>
  <rect width="980" height="580" fill="#f6f1e8"/>
  <text x="24" y="34" font-family="Georgia, serif" font-size="20" fill="#1c1915">Local (dev) — HLD</text>
  <text x="24" y="56" font-family="Georgia, serif" font-size="13" fill="#5e574d">Local (dev) · coding &amp; iteration · not the shared demo URL</text>

  <rect x="20" y="76" width="940" height="430" rx="10" fill="#fffdf8" stroke="#7a2e1f" stroke-width="2"/>
  <text x="40" y="104" font-family="Georgia, serif" font-size="14" fill="#7a2e1f">Local (dev)</text>

  <!-- Frontend -->
  <rect x="48" y="128" width="250" height="250" rx="8" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="173" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7a2e1f">Frontend</text>
  <rect x="68" y="176" width="210" height="52" rx="4" fill="#fffdf8" stroke="#d4cbb8"/>
  <text x="173" y="198" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">Vite</text>
  <text x="173" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5e574d">React + JSX</text>
  <rect x="68" y="244" width="210" height="40" rx="4" fill="#fffdf8" stroke="#d4cbb8"/>
  <text x="173" y="269" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">Public pages</text>
  <text x="173" y="312" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5e574d">:5173</text>
  <text x="173" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5e574d">Home · Gallery · Menu</text>
  <text x="173" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5e574d">Reservations · forms</text>

  <line x1="308" y1="250" x2="348" y2="250" stroke="#7a2e1f" stroke-width="2"/>
  <polygon points="348,250 336,244 336,256" fill="#7a2e1f"/>
  <text x="328" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#7a2e1f">/api/*</text>

  <!-- Backend -->
  <rect x="360" y="128" width="300" height="250" rx="8" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="510" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7a2e1f">Backend · Flask API</text>
  <rect x="380" y="172" width="260" height="36" rx="4" fill="#fffdf8" stroke="#d4cbb8"/>
  <text x="510" y="195" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1c1915">Flask :5000</text>
  <text x="380" y="230" font-family="ui-monospace, monospace" font-size="10" fill="#1c1915">GET  /api/health</text>
  <text x="380" y="246" font-family="ui-monospace, monospace" font-size="10" fill="#1c1915">GET  /api/menu · /api/site</text>
  <text x="380" y="262" font-family="ui-monospace, monospace" font-size="10" fill="#1c1915">GET  /api/slots · /api/availability</text>
  <text x="380" y="278" font-family="ui-monospace, monospace" font-size="10" fill="#1c1915">POST /api/reservations</text>
  <text x="380" y="294" font-family="ui-monospace, monospace" font-size="10" fill="#1c1915">POST /api/newsletter</text>
  <text x="380" y="310" font-family="ui-monospace, monospace" font-size="10" fill="#5e574d">GET  /api/operator · helper</text>
  <text x="380" y="340" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">Fail-closed without DB</text>
  <text x="380" y="358" font-family="Georgia, serif" font-size="10" fill="#5e574d">full book → 409 · no fake success</text>

  <line x1="670" y1="250" x2="710" y2="250" stroke="#7a2e1f" stroke-width="2"/>
  <polygon points="710,250 698,244 698,256" fill="#7a2e1f"/>

  <!-- Data -->
  <rect x="722" y="128" width="210" height="250" rx="8" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="827" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7a2e1f">Data</text>
  <rect x="742" y="176" width="170" height="72" rx="4" fill="#7a2e1f"/>
  <text x="827" y="206" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#f6f1e8">PostgreSQL</text>
  <text x="827" y="226" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#efe4c8">local</text>
  <text x="827" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1c1915">customers</text>
  <text x="827" y="298" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1c1915">reservations</text>
  <text x="827" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">Fail-closed</text>
  <text x="827" y="348" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5e574d">without DB</text>

  <!-- Freeze -->
  <rect x="48" y="400" width="884" height="80" rx="6" fill="#efeae1" stroke="#7a2e1f" stroke-width="1.5"/>
  <text x="490" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7a2e1f">freeze.json — shared config source</text>
  <text x="490" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5e574d">FE imports freeze · API also exposes GET /api/menu · /api/site</text>
  <line x1="173" y1="378" x2="173" y2="400" stroke="#7a2e1f" stroke-dasharray="4 3"/>
  <line x1="510" y1="378" x2="510" y2="400" stroke="#7a2e1f" stroke-dasharray="4 3"/>

  <text x="24" y="540" font-family="Georgia, serif" font-size="12" fill="#5e574d">Same design as staging — local target for speed. Shared demo lives at cafe.artof.link.</text>
  <text x="24" y="562" font-family="Georgia, serif" font-size="11" fill="#5e574d">React + JSX → Flask → PostgreSQL · newsletter store-only until SES</text>
</svg>
