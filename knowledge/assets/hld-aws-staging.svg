  <title id="t3">Cafe Fausse AWS staging high-level design</title>
  <desc id="d3">Weekend Lightsail staging. Route53 A cafe.artof.link to 54.165.102.60 TTL 60. Caddy and Let's Encrypt in front of Flask plus built React SPA and on-box Postgres (MSAIE staging). Knowledge stays on GitHub Pages. Not a shared RDS. The artof.link ELB wildcard is out of cut. Staging stays up until the owner explicitly requests tear-down. Monday 2026-09-08 16:00 Europe/Berlin is evaluate-only.</desc>
