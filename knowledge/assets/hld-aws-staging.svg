  <text x="336" y="492" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">Staging kept until owner decision. Mon 2026-09-08 16:00 CET evaluate-only (#57).</text>
  <text x="336" y="510" font-family="Georgia, serif" font-size="11" fill="#5e574d">Longer-term hosting stays Future #22. This is not a permanent claim.</text>
