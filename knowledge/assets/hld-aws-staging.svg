  <text x="336" y="552" font-family="Georgia, serif" font-size="11" fill="#5e574d">That wildcard is not Cafe Fausse.</text>
  <text x="336" y="578" font-family="Georgia, serif" font-size="11" fill="#5e574d">Old tunnels (shaky-deer-drive, happy-glasses-film, real-goats-shop) are stale.</text>
  <text x="336" y="594" font-family="Georgia, serif" font-size="11" fill="#5e574d">MVP = official SRS FR-1..FR-18 / NFR-1..NFR-9. Do not invent IDs.</text>

