  <title id="t2">Cafe Fausse intended to-be high-level design</title>
  <desc id="d2">Knowledge stays on GitHub Pages. Intended restaurant path is dashed: cafe.artof.link to React to Flask to PostgreSQL. Not live this session.</desc>
