<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="t2 d2">
  <title id="t2">Cafe Fausse intended to-be high-level design</title>
  <desc id="d2">Knowledge stays on GitHub Pages. Weekend Lightsail staging stays up until the owner explicitly requests tear-down. Monday 2026-09-08 16:00 Europe/Berlin is evaluate-only. Permanent restaurant hosting remains Future #22 and is dashed.</desc>
  <rect width="980" height="520" fill="#f6f1e8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1c1915">Cafe Fausse to-be — permanent vs staging keep-up</text>
  <text x="24" y="52" font-family="Georgia, serif" font-size="12" fill="#5e574d">Solid knowledge is already published. Staging #57 is live this weekend. Dashed = permanent hosting #22, still Future.</text>

  <rect x="20" y="72" width="300" height="420" rx="8" fill="#fffdf8" stroke="#7a2e1f" stroke-width="2"/>
  <text x="36" y="98" font-family="Georgia, serif" font-size="14" fill="#7a2e1f">Knowledge — already published</text>
  <rect x="40" y="124" width="260" height="48" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="170" y="145" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">GitHub Actions</text>
  <text x="170" y="161" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5e574d">Markdown to HTML</text>
  <line x1="170" y1="172" x2="170" y2="192" stroke="#7a2e1f"/>
  <rect x="40" y="192" width="260" height="56" rx="4" fill="#7a2e1f"/>
  <text x="170" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#f6f1e8">knowledge.cafe.artof.link</text>
  <text x="170" y="234" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#efe4c8">GET 200 this session</text>
  <text x="40" y="280" font-family="Georgia, serif" font-size="12" fill="#5e574d">Thin map: home, brief, stack,</text>
  <text x="40" y="298" font-family="Georgia, serif" font-size="12" fill="#5e574d">SRS freeze, coverage, honesty,</text>
  <text x="40" y="316" font-family="Georgia, serif" font-size="12" fill="#5e574d">Future. Not a CMS.</text>
  <text x="40" y="350" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">https_enforced=true (probed)</text>
  <text x="40" y="390" font-family="Georgia, serif" font-size="11" fill="#5e574d">Same path as as-is. Keep it.</text>

  <rect x="340" y="72" width="300" height="420" rx="8" fill="#fffdf8" stroke="#7a2e1f" stroke-width="2"/>
  <text x="356" y="98" font-family="Georgia, serif" font-size="14" fill="#7a2e1f">Weekend staging — live now</text>
  <rect x="360" y="124" width="260" height="56" rx="4" fill="#7a2e1f"/>
  <text x="490" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#f6f1e8">cafe.artof.link</text>
  <text x="490" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#efe4c8">Lightsail #57 GET 200</text>
  <line x1="490" y1="180" x2="490" y2="200" stroke="#7a2e1f"/>
  <rect x="360" y="200" width="260" height="40" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="490" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">React SPA + Flask</text>
  <line x1="490" y1="240" x2="490" y2="256" stroke="#7a2e1f"/>
  <rect x="360" y="256" width="260" height="40" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="490" y="281" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">Postgres on the instance</text>
  <text x="360" y="324" font-family="Georgia, serif" font-size="12" fill="#7a2e1f">Kept until owner decision.</text>
  <text x="360" y="342" font-family="Georgia, serif" font-size="12" fill="#7a2e1f">Mon 2026-09-08 16:00 CET evaluate-only.</text>
  <text x="360" y="370" font-family="Georgia, serif" font-size="11" fill="#5e574d">Caddy + Let's Encrypt. AEA RDS out.</text>
  <text x="360" y="388" font-family="Georgia, serif" font-size="11" fill="#5e574d">sslip.io is interim backup only.</text>
  <text x="360" y="420" font-family="Georgia, serif" font-size="11" fill="#5e574d">MVP = official SRS only.</text>
  <text x="360" y="438" font-family="Georgia, serif" font-size="11" fill="#5e574d">FR-1..FR-18, NFR-1..NFR-9.</text>
  <text x="360" y="466" font-family="Georgia, serif" font-size="11" fill="#5e574d">/operator is not FR-19.</text>

  <rect x="660" y="72" width="300" height="420" rx="8" fill="#fffdf8" stroke="#5e574d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="676" y="98" font-family="Georgia, serif" font-size="14" fill="#5e574d">Permanent hosting — still Future</text>
  <rect x="680" y="124" width="260" height="56" rx="4" fill="#efeae1" stroke="#5e574d" stroke-dasharray="5 4"/>
  <text x="810" y="148" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#1c1915">cafe.artof.link</text>
  <text x="810" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5e574d">#22 — not closed by #57</text>
  <line x1="810" y1="180" x2="810" y2="200" stroke="#5e574d" stroke-dasharray="5 4"/>
  <rect x="680" y="200" width="260" height="40" rx="4" fill="#efeae1" stroke="#5e574d" stroke-dasharray="5 4"/>
  <text x="810" y="225" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">React + JSX</text>
  <line x1="810" y1="240" x2="810" y2="256" stroke="#5e574d" stroke-dasharray="5 4"/>
  <rect x="680" y="256" width="260" height="40" rx="4" fill="#efeae1" stroke="#5e574d" stroke-dasharray="5 4"/>
  <text x="810" y="281" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">Flask API</text>
  <line x1="810" y1="296" x2="810" y2="312" stroke="#5e574d" stroke-dasharray="5 4"/>
  <rect x="680" y="312" width="260" height="40" rx="4" fill="#efeae1" stroke="#5e574d" stroke-dasharray="5 4"/>
  <text x="810" y="337" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">PostgreSQL</text>
  <text x="676" y="380" font-family="Georgia, serif" font-size="12" fill="#7a2e1f">Dashed on purpose.</text>
  <text x="676" y="398" font-family="Georgia, serif" font-size="12" fill="#7a2e1f">Do not claim production forever.</text>
  <text x="676" y="426" font-family="Georgia, serif" font-size="11" fill="#5e574d">AWS is not in the restaurant MVP PR.</text>
  <text x="676" y="444" font-family="Georgia, serif" font-size="11" fill="#5e574d">No Kafka, BFF, 14 hats, 3DX, GitLab.</text>
  <text x="676" y="470" font-family="Georgia, serif" font-size="11" fill="#5e574d">#34–#38 stay parked Future extras.</text>
