<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="t1 d1">
  <title id="t1">Cafe Fausse as-is high-level design</title>
  <desc id="d1">Knowledge site is live on GitHub Pages. cafe.artof.link is weekend Lightsail staging this session, not production forever. Local MVP remains Vite, Flask, and Postgres on main.</desc>
  <rect width="980" height="560" fill="#f6f1e8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="18" fill="#1c1915">Cafe Fausse as-is — probed 2026-09-05 Europe/Berlin</text>
  <text x="24" y="52" font-family="Georgia, serif" font-size="12" fill="#5e574d">Two hostnames, two jobs. Staging share is weekend #57 — not production forever. MSAIE cut only.</text>

  <rect x="20" y="72" width="300" height="460" rx="8" fill="#fffdf8" stroke="#7a2e1f" stroke-width="2"/>
  <text x="36" y="98" font-family="Georgia, serif" font-size="14" fill="#7a2e1f">Knowledge — live this session</text>
  <rect x="40" y="116" width="260" height="36" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="170" y="139" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1c1915">knowledge/*.md</text>
  <line x1="170" y1="152" x2="170" y2="168" stroke="#7a2e1f"/>
  <rect x="40" y="168" width="260" height="36" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="170" y="191" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1c1915">knowledge/build.py</text>
  <line x1="170" y1="204" x2="170" y2="220" stroke="#7a2e1f"/>
  <rect x="40" y="220" width="260" height="48" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="170" y="241" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">GitHub Actions</text>
  <text x="170" y="257" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#5e574d">to GitHub Pages</text>
  <line x1="170" y1="268" x2="170" y2="284" stroke="#7a2e1f"/>
  <rect x="40" y="284" width="260" height="56" rx="4" fill="#7a2e1f"/>
  <text x="170" y="308" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#f6f1e8">knowledge.cafe.artof.link</text>
  <text x="170" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#efe4c8">HTTPS GET 200, TLS VERIFY_OK</text>
  <text x="50" y="364" font-family="Georgia, serif" font-size="11" fill="#5e574d">CN/SAN match, Let's Encrypt</text>
  <text x="50" y="382" font-family="Georgia, serif" font-size="11" fill="#5e574d">expires 2026-11-30</text>
  <text x="50" y="408" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">https_enforced=true</text>
  <text x="50" y="426" font-family="Georgia, serif" font-size="11" fill="#5e574d">HTTP 301 to HTTPS</text>
  <text x="50" y="452" font-family="Georgia, serif" font-size="11" fill="#5e574d">CNAME artofdream.github.io</text>
  <text x="50" y="490" font-family="Georgia, serif" font-size="11" fill="#5e574d">Not a CMS. Not the restaurant.</text>

  <rect x="340" y="72" width="300" height="460" rx="8" fill="#fffdf8" stroke="#7a2e1f" stroke-width="2"/>
  <text x="356" y="98" font-family="Georgia, serif" font-size="14" fill="#7a2e1f">Weekend staging share (#57)</text>
  <rect x="360" y="120" width="260" height="56" rx="4" fill="#7a2e1f"/>
  <text x="490" y="144" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#f6f1e8">cafe.artof.link</text>
  <text x="490" y="162" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#efe4c8">HTTPS GET 200 this session</text>
  <line x1="490" y1="176" x2="490" y2="192" stroke="#7a2e1f"/>
  <rect x="360" y="192" width="260" height="72" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="490" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">Route53 A TTL 60</text>
  <text x="490" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5e574d">54.165.102.60</text>
  <text x="490" y="252" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5e574d">overrides *.artof.link ELB wildcard</text>
  <line x1="490" y1="264" x2="490" y2="280" stroke="#7a2e1f"/>
  <rect x="360" y="280" width="260" height="72" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="490" y="304" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">Lightsail cafe-fausse-staging</text>
  <text x="490" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5e574d">us-east-1 · small_3_0 ~$12/mo</text>
  <text x="490" y="338" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#5e574d">Caddy + LE · Flask + SPA · on-box PG</text>
  <text x="360" y="376" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">Staging kept until owner decision.</text>
  <text x="360" y="394" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">Mon 2026-09-08 16:00 CET evaluate-only. Not auto tear-down.</text>
  <text x="360" y="420" font-family="Georgia, serif" font-size="11" fill="#5e574d">Interim: 54-165-102-60.sslip.io</text>
  <text x="360" y="438" font-family="Georgia, serif" font-size="11" fill="#5e574d">On-box Postgres — not a shared RDS. ELB wildcard is not us.</text>
  <text x="360" y="464" font-family="Georgia, serif" font-size="11" fill="#5e574d">/operator = recording helper, not FR-19.</text>
  <text x="360" y="490" font-family="Georgia, serif" font-size="11" fill="#5e574d">Longer-term hosting stays Future #22.</text>

  <rect x="660" y="72" width="300" height="460" rx="8" fill="#fffdf8" stroke="#d4cbb8" stroke-width="2"/>
  <text x="676" y="98" font-family="Georgia, serif" font-size="14" fill="#1c1915">Local MVP on main</text>
  <text x="676" y="118" font-family="Georgia, serif" font-size="11" fill="#5e574d">PRs #9 + timezone #12 — still the code SoT</text>
  <rect x="680" y="140" width="260" height="36" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="810" y="163" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1c1915">Vite :5173</text>
  <line x1="810" y1="176" x2="810" y2="192" stroke="#7a2e1f"/>
  <rect x="680" y="192" width="260" height="36" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="810" y="215" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1c1915">Flask :5000</text>
  <line x1="810" y1="228" x2="810" y2="244" stroke="#7a2e1f"/>
  <rect x="680" y="244" width="260" height="36" rx="4" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="810" y="267" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1c1915">cafe-pg PostgreSQL</text>
  <text x="676" y="320" font-family="Georgia, serif" font-size="11" fill="#5e574d">React + JSX, Flask, Postgres</text>
  <text x="676" y="338" font-family="Georgia, serif" font-size="11" fill="#5e574d">MVP = official SRS only.</text>
  <text x="676" y="368" font-family="Georgia, serif" font-size="11" fill="#5e574d">Journey J1–J8 PASS (cts-ai, DB up)</text>
  <text x="676" y="386" font-family="Georgia, serif" font-size="11" fill="#5e574d">J9 PASS Vite-only (not Flask+PG)</text>
  <text x="676" y="412" font-family="Georgia, serif" font-size="11" fill="#5e574d">This Knowledge VM did not reach Vite.</text>
  <text x="676" y="438" font-family="Georgia, serif" font-size="11" fill="#5e574d">Fail closed: missing DB, full</text>
  <text x="676" y="454" font-family="Georgia, serif" font-size="11" fill="#5e574d">slot (30 tables, FR-9), timeout.</text>
  <text x="676" y="490" font-family="Georgia, serif" font-size="11" fill="#5e574d">Old localtunnel URLs are stale.</text>
</svg>
