<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-labelledby="t1 d1">
  <title id="t1">Café Fausse as-is high-level design</title>
  <desc id="d1">Knowledge site is live on GitHub Pages. cafe.artof.link is an AWS ELB, not our restaurant. Local MVP is Vite, Flask, and Postgres on main.</desc>
