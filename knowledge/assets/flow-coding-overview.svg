<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-labelledby="t4 d4">
  <title id="t4">Part 4 coding overview — forms · functions · frontend · backend · API · DB</title>
  <desc id="d4">Coding rationale map. FE pages import freeze.json. Reservations form to GET /api/slots then POST /api/reservations to Postgres. NewsletterForm POST /api/newsletter store-only. Backend modules reservations newsletter content slots db validate. Fail-closed without DB.</desc>
  <rect width="1180" height="640" fill="#f6f1e8"/>
  <text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#1c1915">Coding overview — forms · functions · FE · BE · API · DB</text>
  <text x="24" y="52" font-family="Georgia, serif" font-size="12" fill="#5e574d">Part 4 why/how · maps to Architecture flow · honest wiring from main</text>

  <!-- Layer labels left -->
  <text x="24" y="96" font-family="Georgia, serif" font-size="11" fill="#7a2e1f">Frontend</text>
