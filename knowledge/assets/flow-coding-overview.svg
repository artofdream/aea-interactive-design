  <text x="260" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#7a2e1f">import @shared/freeze.json</text>
  <text x="260" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5e574d">(+ menu-presentation)</text>
  <text x="260" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5e574d">not /api/menu from FE</text>
  <text x="260" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#5e574d">images → GET /images/…</text>

  <!-- Reservations form -->
  <rect x="440" y="108" width="340" height="110" rx="6" fill="#efeae1" stroke="#7a2e1f" stroke-width="1.5"/>
  <text x="610" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7a2e1f">Reservations form</text>
  <text x="610" y="154" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#1c1915">date · slot · guests · name · email</text>
  <text x="610" y="176" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1915">→ GET /api/slots?date=</text>
  <text x="610" y="196" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#1c1915">→ POST /api/reservations</text>
  <text x="610" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7a2e1f">full → 409 · fail-closed</text>

  <!-- Newsletter form -->
  <rect x="800" y="108" width="340" height="110" rx="6" fill="#efeae1" stroke="#d4cbb8"/>
  <text x="970" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1c1915">NewsletterForm</text>
